name: Test and Package

# Pull requests prove the packaging process still succeeds; tags and manual
# dispatches additionally publish the artifact. The build itself is identical
# in both cases, so a release can never take a code path a PR did not exercise.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 7.4 is the plugin's declared floor. Building here rather than on a
      # newer runtime is what keeps "Requires PHP: 7.4" honest.
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          pnpm install --frozen-lockfile

      - name: Check PHP syntax
        run: |
          find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run PHPUnit
        run: vendor/bin/phpunit --do-not-cache-result

      - name: Run Jest
        run: pnpm exec jest --runInBand

      - name: Build release package
        run: bash scripts/build-release.sh "$GITHUB_WORKSPACE/dist"

      - name: Inspect package contents
        run: unzip -l dist/formtura-*.zip

      # Publishing is gated; the build and verification above are not.
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: formtura-release
          path: dist/formtura-*.zip
          if-no-files-found: error
