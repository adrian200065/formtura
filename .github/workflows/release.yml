name: Test and Package

# Pull requests prove the packaging process still succeeds; tags and manual
# dispatches additionally publish the artifact. The build itself is identical
# in both cases, so a release can never take a code path a PR did not exercise.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The dev toolchain (PHPUnit and its dependencies) requires PHP 8.1+, so the
  # suites cannot run on the plugin's minimum supported version. That is fine:
  # nothing under tests/ ships. The `package` job below is what holds the
  # runtime to PHP 7.4.
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          pnpm install --frozen-lockfile

      - name: Run PHPUnit
        run: vendor/bin/phpunit --do-not-cache-result

      - name: Run PHPCS
        run: vendor/bin/phpcs

      - name: Run Jest
        run: pnpm exec jest --runInBand

      - name: Run ESLint
        run: pnpm run lint

  # Advisories move independently of code changes - a dependency can go from
  # clean to vulnerable between two PRs that touch nothing it depends on - so
  # this runs on its own rather than being folded into `test`, and is not a
  # dependency of `package`: a newly-published advisory should be visible
  # immediately without blocking an otherwise-ready release on it.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          pnpm install --frozen-lockfile

      - name: Composer audit
        run: composer audit

      - name: pnpm audit
        run: pnpm audit

  # Runs on the plugin's declared minimum. Production dependencies install
  # cleanly there because composer.json requires no runtime packages, and
  # verify-release.sh runs `php -l` over every shipped file - so this job is
  # what actually proves "Requires PHP: 7.4" against the code that ships.
  package:
    name: Package (PHP 7.4)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Check production PHP syntax on 7.4
        run: |
          find src templates formtura.php uninstall.php -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      # Builds in its own temporary workspace, installing production
      # dependencies and compiling assets from committed manifests, then
      # verifies the result before emitting a ZIP.
      - name: Build release package
        run: bash scripts/build-release.sh "$GITHUB_WORKSPACE/dist"

      - name: Inspect package contents
        run: unzip -l dist/formtura-*.zip

      # Publishing is gated; the build and verification above are not.
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: formtura-release
          path: dist/formtura-*.zip
          if-no-files-found: error
